[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "github-explorer"
version = "0.3.0"
description = "A standalone terminal workbench for the full installed GitHub CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = ["textual>=8,<9", "rich>=13"]
keywords = ["github", "gh", "tui", "textual", "terminal"]

[project.urls]
Repository = "https://github.com/mithudso/github-explorer"
Issues = "https://github.com/mithudso/github-explorer/issues"

[project.scripts]
github-explorer = "github_explorer.__main__:main"
ghx = "github_explorer.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
